<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Anaglyphic Stereo Rendering - 3D Shoe Model</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #F8F8FF;
        color: #4B0082;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 1200px;
        width: 100%;
        background: #FFFFFF;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(123, 104, 238, 0.15);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #FFB6C1 0%, #E6E6FA 100%);
        padding: 30px;
        text-align: center;
        border-bottom: 3px solid #ADD8E6;
      }

      .header h2 {
        color: #FF69B4;
        margin-bottom: 10px;
        font-size: 2.5em;
        text-shadow: 1px 1px 2px rgba(255, 105, 180, 0.4);
      }

      .header p {
        color: #7B68EE;
        font-size: 1.1em;
        opacity: 0.9;
        font-style: italic;
      }

      .main-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px;
      }

      #canvas-holder {
        border: 3px solid #ADD8E6;
        box-shadow: 0 4px 15px rgba(123, 104, 238, 0.2);
        border-radius: 10px;
        overflow: hidden;
        background-color: #FFFFFF;
        transition: box-shadow 0.3s ease;
        margin-bottom: 20px;
      }

      #canvas-holder:hover {
        box-shadow: 0 4px 20px rgba(255, 105, 180, 0.5);
      }

      #webglcanvas {
        display: block;
        width: 800px;
        height: 600px;
        cursor: grab;
      }

      #webglcanvas:active {
        cursor: grabbing;
      }

      .controls-panel {
        background: #F0F8FF;
        border-radius: 15px;
        padding: 25px;
        width: 100%;
        box-shadow: 0 5px 15px rgba(123, 104, 238, 0.1);
        border: 2px dashed #ADD8E6;
      }

      .panel-title {
        color: #FF69B4;
        font-size: 1.5em;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #ADD8E6;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .control-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .control-item {
        background: #FFFFFF;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 10px rgba(255, 105, 180, 0.1);
        border: 1px solid #E6E6FA;
      }

      .control-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        color: #4B0082;
        font-weight: 500;
      }

      .control-label label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .value-badge {
        background: #E6E6FA;
        color: #7B68EE;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.9em;
        font-weight: 600;
        border: 1px solid #ADD8E6;
      }

      input[type="range"] {
        width: 100%;
        height: 8px;
        border-radius: 5px;
        background: #E6E6FA;
        outline: none;
        -webkit-appearance: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #FF69B4;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(255, 105, 180, 0.3);
        transition: transform 0.2s;
        border: 2px solid #FFFFFF;
      }

      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
        background: #FF1493;
      }

      @media (max-width: 900px) {
        .container {
          border-radius: 10px;
        }
        
        #webglcanvas {
          width: 100%;
          height: auto;
        }
        
        .control-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./StereoCamera.js"></script>
    <script src="./Texture.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./Model.js"></script>
    <script src="./main.js"></script>
  </head>
  <body onload="init()">
    <div class="container">
      <div class="header">
        <h2>3D Shoe Anaglyphic Stereo Rendering</h2>
        <p>Experience depth with red-cyan glasses • Drag to rotate • Webcam background</p>
      </div>

      <div class="main-content">
        <div id="canvas-holder">
          <canvas width="800" height="600" id="webglcanvas"></canvas>
        </div>

        <div class="controls-panel">
          <div class="panel-title">
            Stereo Camera Controls
          </div>

          <div class="control-grid">
            <div class="control-item">
              <div class="control-label">
                <label>Eye Separation</label>
                <span class="value-badge" id="eyeSepValue">0.7</span>
              </div>
              <input type="range" id="eyeSeparation" min="0.1" max="2.0" step="0.1" value="0.7" oninput="updateEyeSepValue(this.value); updateParameters();">
            </div>

            <div class="control-item">
              <div class="control-label">
                <label>Field of View</label>
                <span class="value-badge" id="fovValue">0.4</span>
              </div>
              <input type="range" id="fov" min="0.1" max="1.0" step="0.05" value="0.4" oninput="updateFovValue(this.value); updateParameters();">
            </div>

            <div class="control-item">
              <div class="control-label">
                <label>Near Clipping</label>
                <span class="value-badge" id="nearValue">8.0</span>
              </div>
              <input type="range" id="nearClipping" min="1.0" max="10.0" step="0.5" value="8.0" oninput="updateNearValue(this.value); updateParameters();">
            </div>

            <div class="control-item">
              <div class="control-label">
                <label>Convergence Distance</label>
                <span class="value-badge" id="convValue">14.0</span>
              </div>
              <input type="range" id="convergence" min="10.0" max="20.0" step="0.5" value="14.0" oninput="updateConvValue(this.value); updateParameters();">
            </div>
          </div>
        </div>
      </div>

    </div>

    <script>
      function updateEyeSepValue(value) {
        document.getElementById("eyeSepValue").textContent = parseFloat(value).toFixed(1);
      }

      function updateFovValue(value) {
        document.getElementById("fovValue").textContent = parseFloat(value).toFixed(2);
      }

      function updateNearValue(value) {
        document.getElementById("nearValue").textContent = parseFloat(value).toFixed(1);
      }

      function updateConvValue(value) {
        document.getElementById("convValue").textContent = parseFloat(value).toFixed(1);
      }
    </script>
  </body>
</html>
